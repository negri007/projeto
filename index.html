<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ECHO - Entrar ou Criar Conta</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <!-- Fonte do efeito -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet" />
    <!-- Echo Core Stylesheet -->
    <link href="css/echo.css" rel="stylesheet" />
</head>
<body>
    <div id="app"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- GSAP para o efeito splash -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
    <script src="js/echo-ui.js"></script>

    <script>
        /* =====================================================
           SPLASH ECHO (DECODER)
        ===================================================== */
        function renderSplash() {
            document.getElementById("app").innerHTML = `
                <div class="splash-container">
                    <div class="splash-text-wrapper">
                        <h1 class="splash-text" id="echoSplashText"></h1>
                    </div>
                </div>
            `;

            const textElement = document.getElementById('echoSplashText');
            const originalText = "ECHO";
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890!@#$%^&*()_-+=[]{}|;:,.<>?';

            originalText.split('').forEach(char => {
                const span = document.createElement('span');
                span.innerHTML = char === ' ' ? '&nbsp;' : char;
                textElement.appendChild(span);
            });

            const letters = Array.from(textElement.children);

            function createDecoderAnimation() {
                const tl = gsap.timeline({
                    onComplete: () => {
                        setTimeout(renderLogin, 400);
                    }
                });

                letters.forEach((letter, i) => {
                    const originalChar = letter.innerHTML;
                    if (originalChar === '&nbsp;') return;

                    tl.to(letter, {
                        duration: 1.5,
                        ease: "power2.inOut",
                        onStart: () => {
                            const interval = setInterval(() => {
                                const randomIndex = Math.floor(Math.random() * chars.length);
                                letter.textContent = chars[randomIndex];
                            }, 40);
                            letter._interval = interval;
                        },
                        onComplete: () => {
                            clearInterval(letter._interval);
                            letter.textContent = originalChar;
                        }
                    }, i * 0.12);
                });

                tl.to({}, { duration: 0.3 });
            }

            createDecoderAnimation();
        }

        /* =====================================================
           RENDER DE TELAS (LOGIN / REGISTER / FORGOT PASSWORD)
        ===================================================== */

        function renderLogin() {
            document.getElementById("app").innerHTML = `
            <div class="container-fluid auth-layout">
                <div class="row">
                    <!-- LADO ESQUERDO -->
                    <div class="col-lg-7 d-none d-lg-flex auth-hero">
                        <div>
                            <div class="auth-logo">
                                <i class="fa-solid fa-hashtag"></i>
                            </div>
                            <div class="auth-title">Acontecendo agora no ECHO</div>
                            <div class="auth-subtitle">Entre no Echo para acompanhar os assuntos e interagir com sua rede.</div>

                            <div class="auth-highlight">
                                <p><i class="fa-regular fa-bell"></i> Notificações e alertas em tempo real.</p>
                                <p><i class="fa-regular fa-comment"></i> Publicações e conversas dinâmicas.</p>
                                <p><i class="fa-regular fa-star"></i> Círculos e conteúdos exclusivos.</p>
                            </div>
                        </div>
                    </div>

                    <!-- LADO DIREITO - LOGIN -->
                    <div class="col-lg-5 col-md-8 mx-auto auth-card-wrap">
                        <div class="auth-card">
                            <h2>Entrar</h2>
                            <p class="auth-card-sub">Use seu e-mail cadastrado para acessar sua conta.</p>

                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <div class="input-icon-wrapper">
                                    <i class="fa-regular fa-envelope"></i>
                                    <input id="email" type="email" class="form-control" placeholder="email@exemplo.com">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Senha</label>
                                <div class="input-icon-wrapper">
                                    <i class="fa-solid fa-lock"></i>
                                    <input id="senha" type="password" class="form-control" placeholder="••••••••">
                                </div>
                            </div>

                            <button class="btn btn-primary w-100 btn-auth" onclick="login()">Entrar</button>

                            <div class="auth-links">
                                <p>Não tem conta?
                                    <button onclick="renderRegister()">Criar conta</button>
                                </p>
                                <p>
                                    <button onclick="renderReset()">Esqueci minha senha</button>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        function renderRegister() {
            document.getElementById("app").innerHTML = `
            <div class="container-fluid auth-layout">
                <div class="row">
                    <!-- LADO ESQUERDO -->
                    <div class="col-lg-7 d-none d-lg-flex auth-hero">
                        <div>
                            <div class="auth-logo">
                                <i class="fa-solid fa-hashtag"></i>
                            </div>
                            <div class="auth-title">Junte-se ao Echo</div>
                            <div class="auth-subtitle">Crie sua conta e comece a compartilhar em poucos segundos.</div>

                            <div class="auth-highlight">
                                <p><i class="fa-solid fa-bolt"></i> Cadastro simples e objetivo.</p>
                                <p><i class="fa-regular fa-heart"></i> Conecte-se com amigos e círculos.</p>
                                <p><i class="fa-solid fa-shield-halved"></i> Seus dados, sob seu controle.</p>
                            </div>
                        </div>
                    </div>

                    <!-- LADO DIREITO - CADASTRO -->
                    <div class="col-lg-5 col-md-8 mx-auto auth-card-wrap">
                        <div class="auth-card">
                            <h2>Criar conta</h2>
                            <p class="auth-card-sub">Preencha os campos abaixo para criar seu perfil.</p>

                            <div class="mb-3">
                                <label class="form-label">Nome</label>
                                <div class="input-icon-wrapper">
                                    <i class="fa-regular fa-user"></i>
                                    <input id="r-nome" type="text" class="form-control" placeholder="Seu nome">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <div class="input-icon-wrapper">
                                    <i class="fa-regular fa-envelope"></i>
                                    <input id="r-email" type="email" class="form-control" placeholder="email@exemplo.com">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Senha</label>
                                <div class="input-icon-wrapper">
                                    <i class="fa-solid fa-lock"></i>
                                    <input id="r-senha" type="password" class="form-control" placeholder="••••••••">
                                </div>
                            </div>

                            <button class="btn btn-primary w-100 btn-auth" onclick="registerUser()">Criar conta</button>

                            <div class="auth-links">
                                <p>
                                    <button onclick="renderLogin()">Voltar ao login</button>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        // TELA DE ESQUECI MINHA SENHA (ENVIO DE LINK)
        function renderReset() {
            document.getElementById("app").innerHTML = `
            <div class="container-fluid auth-layout">
                <div class="row">
                    <!-- LADO ESQUERDO -->
                    <div class="col-lg-7 d-none d-lg-flex auth-hero">
                        <div>
                            <div class="auth-logo">
                                <i class="fa-solid fa-hashtag"></i>
                            </div>
                            <div class="auth-title">Esqueceu a senha?</div>
                            <div class="auth-subtitle">Digite seu e-mail para receber um link seguro de redefinição de senha.</div>

                            <div class="auth-highlight">
                                <p><i class="fa-solid fa-paper-plane"></i> Envio automático de link para o e-mail.</p>
                                <p><i class="fa-solid fa-lock"></i> Token de recuperação seguro e temporário.</p>
                            </div>
                        </div>
                    </div>

                    <!-- LADO DIREITO - FORGOT PASSWORD -->
                    <div class="col-lg-5 col-md-8 mx-auto auth-card-wrap">
                        <div class="auth-card">
                            <h2>Recuperar senha</h2>
                            <p class="auth-card-sub">Informe seu e-mail para enviarmos o link de recuperação.</p>

                            <div id="forgotAlert" style="display:none;"></div>

                            <div id="forgotFormArea">
                                <div class="mb-3">
                                    <label class="form-label">Email cadastrado</label>
                                    <div class="input-icon-wrapper">
                                        <i class="fa-regular fa-envelope"></i>
                                        <input id="x-email" type="email" class="form-control" placeholder="email@exemplo.com">
                                    </div>
                                </div>

                                <button id="btnForgotSubmit" class="btn btn-primary w-100 btn-auth" onclick="requestForgotPassword()">Enviar link de recuperação</button>
                            </div>

                            <div class="auth-links">
                                <p>
                                    <button onclick="renderLogin()"><i class="fa-solid fa-arrow-left me-1"></i>Voltar ao login</button>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        /* =====================================================
           AUTENTICAÇÃO E CHAMADAS DE API
        ===================================================== */

        async function login() {
            let email = document.getElementById("email").value.trim();
            // Sem trim na senha: espaco nas pontas faz parte dela.
            let senha = document.getElementById("senha").value;

            if (!email || !senha) {
                alert("Por favor, preencha o e-mail e a senha.");
                return;
            }

            let res = await fetch("api/auth/login.php", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                credentials: "same-origin",
                body: JSON.stringify({ email: email, password: senha })
            });

            let data = await res.json();

            if (data.error) {
                alert(data.error);
                return;
            }

            if (data.success || data.ok || (data.user && data.user.id)) {
                // A identidade vive na sessao PHP; o localStorage nao
                // participa mais da autenticacao.
                window.location = "inicio.html";
            } else {
                alert("Erro ao realizar login.");
            }
        }

        async function registerUser() {
            let nome = document.getElementById("r-nome").value.trim();
            let email = document.getElementById("r-email").value.trim();
            let senha = document.getElementById("r-senha").value;

            if (!nome || !email || !senha) {
                alert("Preencha todos os campos.");
                return;
            }

            // Mesmo minimo que api/auth/register.php exige.
            if (senha.length < 8) {
                alert("A senha precisa ter pelo menos 8 caracteres.");
                return;
            }

            let res = await fetch("api/auth/register.php", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                credentials: "same-origin",
                body: JSON.stringify({ name: nome, email: email, password: senha })
            });

            let data = await res.json();

            if (data.error) {
                alert(data.error);
                return;
            }

            // O cadastro ja abre sessao: entra direto no feed.
            window.location = "inicio.html";
        }

        async function requestForgotPassword() {
            let email = document.getElementById("x-email").value.trim();
            let alertBox = document.getElementById("forgotAlert");
            let btn = document.getElementById("btnForgotSubmit");

            if (!email) {
                alertBox.className = "alert-custom alert-custom-danger";
                alertBox.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i><div>Por favor, digite seu e-mail.</div>';
                alertBox.style.display = "flex";
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<span class="spinner-echo me-2" style="width:16px;height:16px;border-width:2px;"></span>Enviando...`;

            try {
                let res = await fetch("api/auth/forgot_password.php", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "same-origin",
                    body: JSON.stringify({ email: email })
                });
                let data = await res.json();

                // O back responde a mesma coisa exista ou nao o e-mail,
                // de proposito: nao vazar quais enderecos sao cadastrados.
                alertBox.className = "alert-custom alert-custom-success";
                alertBox.innerHTML = `<i class="fa-solid fa-circle-check"></i><div>${data.message || "Se o e-mail existir, um link foi enviado."}</div>`;
                alertBox.style.display = "flex";
                document.getElementById("forgotFormArea").style.display = "none";
            } catch (e) {
                alertBox.className = "alert-custom alert-custom-danger";
                alertBox.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i><div>Erro ao solicitar recuperação. Tente novamente.</div>';
                alertBox.style.display = "flex";
            } finally {
                btn.disabled = false;
                btn.innerHTML = "Enviar link de recuperação";
            }
        }

        document.addEventListener("DOMContentLoaded", async function () {
            const user = await EchoUIInstance.checkAuth({ redirectOnFail: false });
            if (user) {
                window.location = "inicio.html";
                return;
            }
            renderSplash();
        });
    </script>
</body>
</html>
