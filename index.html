<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ECHO - Login</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Font Awesome -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <!-- Fonte do efeito -->
    <link
      href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />

    <style>
        :root {
            --bg-main: #000000;
            --bg-card: #0f1419;
            --border-soft: #2f3336;
            --accent: #1d9bf0;
            --text-soft: #71767b;
        }

        body {
            margin: 0;
            background: var(--bg-main);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .auth-layout {
            max-width: 1300px;
            margin: 0 auto;
            min-height: 100vh;
        }

        /* ========= SPLASH ECHO DECODER ========= */
        .splash-container {
            margin: 0;
            padding: 0;
            font-family: 'Share Tech Mono', monospace;
            background: #000;
            color: var(--accent);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .splash-text-wrapper {
            text-align: center;
        }

        .splash-text {
            font-weight: 400;
            font-size: clamp(2.5rem, 10vw, 8rem);
            position: relative;
            color: var(--accent);
            text-shadow:
                0 0 5px var(--accent),
                0 0 15px var(--accent),
                0 0 30px var(--accent);
            cursor: default;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .splash-text span {
            display: inline-block;
            position: relative;
            min-width: 0.5ch;
            will-change: contents;
        }

        /* ========= LADO ESQUERDO (marca / destaque) ========= */
        .auth-hero {
            border-right: 1px solid var(--border-soft);
            min-height: 100vh;
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .auth-logo {
            font-size: 3rem;
            color: var(--accent);
            margin-bottom: 24px;
        }

        .auth-title {
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 8px;
        }

        .auth-subtitle {
            font-size: 1.1rem;
            color: var(--text-soft);
            margin-bottom: 24px;
        }

        .auth-highlight {
            margin-top: 12px;
            font-size: 0.95rem;
            color: var(--text-soft);
        }

        .auth-highlight i {
            color: var(--accent);
            margin-right: 6px;
        }

        /* ========= CARD DIREITA (login/cadastro/reset) ========= */
        .auth-card-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border-soft);
            padding: 24px 20px;
        }

        .auth-card h2 {
            font-weight: 800;
            margin-bottom: 4px;
        }

        .auth-card-sub {
            font-size: 0.95rem;
            color: var(--text-soft);
            margin-bottom: 20px;
        }

        .form-label {
            font-size: 0.9rem;
            color: var(--text-soft);
        }

        .form-control {
            background: transparent;
            border-radius: 999px;
            border: 1px solid var(--border-soft);
            color: #ffffff;
            padding-left: 40px;
        }

        .form-control::placeholder {
            color: #555;
        }

        .form-control:focus {
            box-shadow: none;
            border-color: var(--accent);
        }

        .input-icon-wrapper {
            position: relative;
        }

        .input-icon-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-soft);
            font-size: 0.9rem;
        }

        .btn-auth {
            border-radius: 999px;
            font-weight: 700;
            padding: 10px 0;
            margin-top: 4px;
        }

        .auth-links {
            text-align: center;
            margin-top: 18px;
            font-size: 0.92rem;
        }

        .auth-links button {
            background: none;
            border: none;
            color: var(--accent);
            padding: 0;
            cursor: pointer;
            font-size: 0.92rem;
        }

        .auth-links button:hover {
            text-decoration: underline;
        }

        .auth-links p {
            margin-bottom: 4px;
            color: var(--text-soft);
        }

        @media (max-width: 992px) {
            .auth-hero {
                display: none;
            }
        }
    </style>
</head>

<body>
    <div id="app"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- GSAP para o efeito -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>

    <script>
        /* =====================================================
           SPLASH ECHO (DECODER) – baseado no que você mandou
        ===================================================== */

        function renderSplash() {
            document.getElementById("app").innerHTML = `
                <div class="splash-container">
                    <div class="splash-text-wrapper">
                        <h1 class="splash-text" id="echoSplashText"></h1>
                    </div>
                </div>
            `;

            const textElement = document.getElementById('echoSplashText');
            const originalText = "ECHO";
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890!@#$%^&*()_-+=[]{}|;:,.<>?';

            // monta os spans
            originalText.split('').forEach(char => {
                const span = document.createElement('span');
                span.innerHTML = char === ' ' ? '&nbsp;' : char;
                textElement.appendChild(span);
            });

            const letters = Array.from(textElement.children);

            function createDecoderAnimation() {
                const tl = gsap.timeline({
                    onComplete: () => {
                        // depois da animação, chama o login
                        setTimeout(renderLogin, 400);
                    }
                });

                letters.forEach((letter, i) => {
                    const originalChar = letter.innerHTML;
                    if (originalChar === '&nbsp;') return;

                    tl.to(letter, {
                        duration: 1.5,
                        ease: "power2.inOut",
                        onStart: () => {
                            const interval = setInterval(() => {
                                const randomIndex = Math.floor(Math.random() * chars.length);
                                letter.textContent = chars[randomIndex];
                            }, 40);
                            letter._interval = interval;
                        },
                        onComplete: () => {
                            clearInterval(letter._interval);
                            letter.textContent = originalChar;
                        }
                    }, i * 0.12);
                });

                // só uma vez, sem loop infinito
                tl.to({}, { duration: 0.3 });
            }

            createDecoderAnimation();
        }

        /* =====================================================
           RENDER DE TELAS (LOGIN / REGISTER / RESET)
           – mesma lógica que você já tinha
        ===================================================== */

        function renderLogin() {
            document.getElementById("app").innerHTML = `
            <div class="container-fluid auth-layout">
                <div class="row">
                    <!-- LADO ESQUERDO -->
                    <div class="col-lg-7 d-none d-lg-flex auth-hero">
                        <div>
                            <div class="auth-logo">
                                <i class="fa-brands fa-x-twitter"></i>
                            </div>
                            <div class="auth-title">Acontecendo agora</div>
                            <div class="auth-subtitle">Entre no Echo para ver o que está rolando na sua rede.</div>

                            <div class="auth-highlight">
                                <p><i class="fa-regular fa-bell"></i> Notificações em tempo real.</p>
                                <p><i class="fa-regular fa-comment"></i> Interações rápidas e simples.</p>
                                <p><i class="fa-regular fa-star"></i> Conteúdos feitos para você.</p>
                            </div>
                        </div>
                    </div>

                    <!-- LADO DIREITO - LOGIN -->
                    <div class="col-lg-5 col-md-8 mx-auto auth-card-wrap">
                        <div class="auth-card">
                            <h2>Entrar</h2>
                            <p class="auth-card-sub">Use seu e-mail cadastrado para acessar sua conta.</p>

                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <div class="input-icon-wrapper">
                                    <i class="fa-regular fa-envelope"></i>
                                    <input id="email" type="email" class="form-control" placeholder="email@exemplo.com">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Senha</label>
                                <div class="input-icon-wrapper">
                                    <i class="fa-solid fa-lock"></i>
                                    <input id="senha" type="password" class="form-control" placeholder="••••••••">
                                </div>
                            </div>

                            <button class="btn btn-primary w-100 btn-auth" onclick="login()">Entrar</button>

                            <div class="auth-links">
                                <p>Não tem conta?
                                    <button onclick="renderRegister()">Criar conta</button>
                                </p>
                                <p>
                                    <button onclick="renderReset()">Esqueci a senha</button>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        function renderRegister() {
            document.getElementById("app").innerHTML = `
            <div class="container-fluid auth-layout">
                <div class="row">
                    <!-- LADO ESQUERDO -->
                    <div class="col-lg-7 d-none d-lg-flex auth-hero">
                        <div>
                            <div class="auth-logo">
                                <i class="fa-brands fa-x-twitter"></i>
                            </div>
                            <div class="auth-title">Junte-se ao Echo</div>
                            <div class="auth-subtitle">Crie sua conta e comece a postar em poucos segundos.</div>

                            <div class="auth-highlight">
                                <p><i class="fa-solid fa-bolt"></i> Cadastro simples e objetivo.</p>
                                <p><i class="fa-regular fa-heart"></i> Conecte-se com amigos e comunidades.</p>
                                <p><i class="fa-solid fa-shield-halved"></i> Seus dados, sob seu controle.</p>
                            </div>
                        </div>
                    </div>

                    <!-- LADO DIREITO - CADASTRO -->
                    <div class="col-lg-5 col-md-8 mx-auto auth-card-wrap">
                        <div class="auth-card">
                            <h2>Criar conta</h2>
                            <p class="auth-card-sub">Preencha os campos abaixo para criar seu perfil.</p>

                            <div class="mb-3">
                                <label class="form-label">Nome</label>
                                <div class="input-icon-wrapper">
                                    <i class="fa-regular fa-user"></i>
                                    <input id="r-nome" type="text" class="form-control" placeholder="Seu nome">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <div class="input-icon-wrapper">
                                    <i class="fa-regular fa-envelope"></i>
                                    <input id="r-email" type="email" class="form-control" placeholder="email@exemplo.com">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Senha</label>
                                <div class="input-icon-wrapper">
                                    <i class="fa-solid fa-lock"></i>
                                    <input id="r-senha" type="password" class="form-control" placeholder="••••••••">
                                </div>
                            </div>

                            <button class="btn btn-primary w-100 btn-auth" onclick="registerUser()">Criar conta</button>

                            <div class="auth-links">
                                <p>
                                    <button onclick="renderLogin()">Voltar ao login</button>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        function renderReset() {
            document.getElementById("app").innerHTML = `
            <div class="container-fluid auth-layout">
                <div class="row">
                    <!-- LADO ESQUERDO -->
                    <div class="col-lg-7 d-none d-lg-flex auth-hero">
                        <div>
                            <div class="auth-logo">
                                <i class="fa-brands fa-x-twitter"></i>
                            </div>
                            <div class="auth-title">Esqueceu a senha?</div>
                            <div class="auth-subtitle">Não se preocupe, você pode criar uma nova agora mesmo.</div>

                            <div class="auth-highlight">
                                <p><i class="fa-solid fa-unlock-keyhole"></i> Processo rápido e seguro.</p>
                                <p><i class="fa-regular fa-face-smile"></i> Volte a usar sua conta em instantes.</p>
                            </div>
                        </div>
                    </div>

                    <!-- LADO DIREITO - RESET -->
                    <div class="col-lg-5 col-md-8 mx-auto auth-card-wrap">
                        <div class="auth-card">
                            <h2>Resetar senha</h2>
                            <p class="auth-card-sub">Informe seu e-mail e a nova senha desejada.</p>

                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <div class="input-icon-wrapper">
                                    <i class="fa-regular fa-envelope"></i>
                                    <input id="x-email" type="email" class="form-control" placeholder="email@exemplo.com">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Nova senha</label>
                                <div class="input-icon-wrapper">
                                    <i class="fa-solid fa-lock"></i>
                                    <input id="x-pass" type="password" class="form-control" placeholder="••••••••">
                                </div>
                            </div>

                            <button class="btn btn-primary w-100 btn-auth" onclick="resetPassword()">Alterar senha</button>

                            <div class="auth-links">
                                <p>
                                    <button onclick="renderLogin()">Voltar ao login</button>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        /* =====================================================
           LÓGICA ORIGINAL (NÃO MEXI)
        ===================================================== */

        async function login() {
            let email = document.getElementById("email").value.trim();
            let senha = document.getElementById("senha").value.trim();

            let res = await fetch("api/auth/login.php", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: email, password: senha })
            });

            let data = await res.json();

            if (data.error) {
                alert(data.error);
                return;
            }

            localStorage.setItem("userEmail", email);
            window.location = "explorar.html";
        }

        async function registerUser() {
            let nome = document.getElementById("r-nome").value.trim();
            let email = document.getElementById("r-email").value.trim();
            let senha = document.getElementById("r-senha").value.trim();

            let res = await fetch("api/auth/register.php", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name: nome, email: email, password: senha })
            });

            let data = await res.json();

            if (data.error) {
                alert(data.error);
                return;
            }

            alert("Conta criada com sucesso!");
            renderLogin();
        }

        async function resetPassword() {
            let email = document.getElementById("x-email").value.trim();
            let novaSenha = document.getElementById("x-pass").value.trim();

            let res = await fetch("api/auth/reset.php", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: email, new_pass: novaSenha })
            });

            let data = await res.json();

            if (data.error) {
                alert(data.error);
                return;
            }

            alert("Senha alterada com sucesso!");
            renderLogin();
        }

        // começa na intro ECHO
        document.addEventListener("DOMContentLoaded", renderSplash);
    </script>
</body>
</html>
