<?xml version="1.0" encoding="UTF-8"?>
<!--
  Favicon do Echo: a mesma marca da barra lateral (.logo-mark no echo.css),
  redesenhada em SVG porque o original é um glifo do Font Awesome dentro de
  uma <div>, e nada disso serve de ícone de aba.

  Traço reto no lugar do "#" inclinado do Font Awesome: a 16px a inclinação
  vira borrão e as quatro hastes deixam de se ler como cerquilha.

  O disco escuro é próprio, não transparente, para a marca funcionar tanto
  em aba clara quanto em escura sem precisar de duas versões.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="fundo" cx="32%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#123a5c"/>
      <stop offset="70%" stop-color="#050608"/>
    </radialGradient>
  </defs>

  <circle cx="32" cy="32" r="29" fill="url(#fundo)" stroke="#1d9bf0" stroke-width="4"/>

  <g stroke="#1d9bf0" stroke-width="6" stroke-linecap="round">
    <line x1="24" y1="16" x2="24" y2="48"/>
    <line x1="40" y1="16" x2="40" y2="48"/>
    <line x1="15" y1="25" x2="49" y2="25"/>
    <line x1="15" y1="39" x2="49" y2="39"/>
  </g>
</svg>
