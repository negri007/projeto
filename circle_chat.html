<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECHO - Chat do Círculo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="css/echo.css" rel="stylesheet">

    <style>
        .circle-chat-box {
            height: calc(100vh - 160px);
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg-box {
            background: var(--bg-card);
            border: 1px solid var(--border-soft);
            padding: 10px 14px;
            border-radius: var(--radius-lg);
            max-width: 75%;
            align-self: flex-start;
        }

        .msg-you {
            background: var(--accent-hover);
            border-color: var(--accent);
            align-self: flex-end;
        }

        .msg-author {
            font-size: 0.8rem;
            color: var(--accent);
            font-weight: 700;
        }

        .msg-you .msg-author {
            color: #fff;
        }
    </style>
</head>
<body>
<div class="container-fluid layout">
    <div class="row">
        <!-- SIDEBAR -->
        <aside class="col-lg-2 col-md-3 d-none d-md-flex flex-column sidebar">
            <div class="logo d-flex align-items-center gap-2">
                <div class="logo-mark">
                    <i class="fa-solid fa-hashtag"></i>
                </div>
                <span class="logo-text">ECHO</span>
            </div>

            <nav class="nav flex-column mb-3">
                <a class="nav-link" href="explorar.html">
                    <i class="fa-solid fa-magnifying-glass"></i><span>Explorar</span>
                </a>
                <a class="nav-link" href="inicio.html">
                    <i class="fa-solid fa-house"></i><span>Início</span>
                </a>
                <a class="nav-link" href="perfil.html">
                    <i class="fa-solid fa-user"></i><span>Perfil</span>
                </a>
                <a class="nav-link active" href="circulos.html">
                    <i class="fa-regular fa-circle"></i><span>Círculos</span>
                </a>
                <a class="nav-link" href="amigos.html">
                    <i class="fa-solid fa-user-group"></i><span>Amigos</span>
                </a>
                <a class="nav-link" href="chat.html">
                    <i class="fa-solid fa-comments"></i><span>Mensagens</span>
                </a>
            </nav>
        </aside>

        <!-- COLUNA CENTRAL -->
        <main class="col-lg-10 col-md-9 main-col">
            <div class="main-header">
                <div class="d-flex align-items-center gap-2">
                    <a href="circulos.html" class="btn btn-sm btn-outline-secondary rounded-pill me-1" title="Voltar para Círculos">
                        <i class="fa-solid fa-arrow-left"></i>
                    </a>
                    <button class="mobile-header-toggle" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileSidebarOffcanvas">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <span class="main-header-title" id="circleTitle">Chat do Círculo</span>
                </div>

                <!-- SINO DE NOTIFICAÇÕES -->
                <div id="notificationBellContainer"></div>
            </div>

            <div id="messages" class="circle-chat-box"></div>

            <div class="p-3 border-top border-secondary bg-black">
                <div class="d-flex gap-2">
                    <input id="msgInput" class="form-control form-control-sm rounded-pill" placeholder="Digite sua mensagem no círculo..." onkeypress="if(event.key==='Enter') sendMessage()">
                    <button class="btn btn-primary btn-sm rounded-pill px-4" onclick="sendMessage()">
                        <i class="fa-solid fa-paper-plane me-1"></i>Enviar
                    </button>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/echo-ui.js"></script>

<script>
let currentUser = null;
// O circulo vem da URL (?circle_id=...), com o localStorage como
// compatibilidade para links antigos.
const params     = new URLSearchParams(window.location.search);
let circleId     = params.get("circle_id") || localStorage.getItem("circle_id");
let circleName   = params.get("name") || localStorage.getItem("circle_name");
let isFirstLoad  = true;
let pollTimer    = null;
// Ultimo ID pintado: o poller so acrescenta o que chegou depois.
let lastMessageId = 0;

document.addEventListener("DOMContentLoaded", async function () {
    // Checagem de autenticação via sessão PHP (GET /api/auth/me.php)
    currentUser = await EchoUIInstance.checkAuth({ redirectOnFail: true });
    if (!currentUser) return;

    if (!circleId) {
        document.getElementById("messages").innerHTML =
            "<p class='text-danger text-center my-auto'>Nenhum círculo selecionado. Volte para a lista de círculos.</p>";
        document.getElementById("msgInput").disabled = true;
        return;
    }

    if (circleName) {
        document.getElementById("circleTitle").textContent = "Círculo: " + circleName;
    }

    // Inicializa Header (Sino + Mobile Sidebar)
    document.getElementById('notificationBellContainer').innerHTML = EchoUIInstance.getNotificationBellHTML();
    EchoUIInstance.initHeader('circulos');

    loadMessages();
    pollTimer = setInterval(loadMessages, 3000);
});

async function loadMessages() {
    const box = document.getElementById("messages");
    if (isFirstLoad) {
        box.innerHTML = EchoUIInstance.getListSkeletonHTML(3);
    }

    try {
        const res = await fetch(
            "api/circle_messages/list.php?circle_id=" + encodeURIComponent(circleId),
            { credentials: "same-origin" }
        );
        const data = await res.json();

        if (isFirstLoad) {
            box.innerHTML = "";
            isFirstLoad = false;
        }

        // Acesso negado (nao sou dono nem membro) vem como `error`.
        // Antes isso caia no ramo de "nenhuma mensagem" e a tela mentia.
        if (data.error) {
            if (pollTimer) clearInterval(pollTimer);
            box.innerHTML = `<p class="text-danger text-center my-auto">${EchoUIInstance.escapeHTML(data.error)}</p>`;
            document.getElementById("msgInput").disabled = true;
            return;
        }

        const messages = data.messages || [];

        if (messages.length === 0) {
            box.innerHTML = "<p class='text-secondary text-center my-auto'>Nenhuma mensagem no círculo ainda. Comece a conversa!</p>";
            lastMessageId = 0;
            return;
        }

        const novas = messages.filter(m => Number(m.id) > lastMessageId);
        if (novas.length === 0) return;

        if (lastMessageId === 0) box.innerHTML = "";

        const grudadoNoFim = box.scrollTop + box.clientHeight >= box.scrollHeight - 40;

        novas.forEach(m => {
            // "E minha?" por user_id, nunca por e-mail.
            const isYou = Number(m.user_id) === Number(currentUser.id);
            const div = document.createElement("div");
            div.className = "msg-box " + (isYou ? "msg-you" : "");
            div.innerHTML = `
                <div class="msg-author">${EchoUIInstance.escapeHTML(m.name)}</div>
                <div>${EchoUIInstance.escapeHTML(m.message)}</div>
            `;
            div.title = m.created_at;
            box.appendChild(div);
            lastMessageId = Math.max(lastMessageId, Number(m.id));
        });

        if (grudadoNoFim) box.scrollTop = box.scrollHeight;
    } catch(e) {
        if (isFirstLoad) {
            box.innerHTML = "<p class='text-danger text-center my-auto'>Erro ao carregar mensagens do círculo.</p>";
        }
    }
}

async function sendMessage() {
    const msgInput = document.getElementById("msgInput");
    const msg = msgInput.value.trim();
    if (!msg || !circleId) return;

    msgInput.disabled = true;

    try {
        const res = await fetch("api/circle_messages/send.php", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "same-origin",
            body: JSON.stringify({ circle_id: Number(circleId), message: msg })
        });
        const data = await res.json();

        if (data.error) {
            EchoUIInstance.toastError(data.error);
            return;
        }

        msgInput.value = "";
        loadMessages();
    } catch (e) {
        EchoUIInstance.toastError("Erro ao enviar mensagem.");
    } finally {
        msgInput.disabled = false;
        msgInput.focus();
    }
}
</script>
</body>
</html>
