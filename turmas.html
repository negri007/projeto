<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turmas — Echo (vertical acadêmico)</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --line:#2a2f3a; --fg:#e8eaed; --mut:#9aa0aa; --ac:#5b8cff; --ac2:#3fb27f; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  .wrap { max-width:820px; margin:0 auto; padding:24px 16px 80px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--mut); margin:0 0 24px; font-size:13px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  .card h2 { font-size:15px; margin:0 0 12px; }
  label { display:block; font-size:13px; color:var(--mut); margin:10px 0 4px; }
  input, textarea, select { width:100%; padding:9px 11px; background:#0f1218; border:1px solid var(--line); border-radius:8px; color:var(--fg); font:inherit; }
  textarea { min-height:80px; resize:vertical; }
  button { cursor:pointer; border:0; border-radius:8px; padding:9px 14px; font:inherit; font-weight:600; color:#fff; background:var(--ac); margin-top:12px; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--fg); font-weight:500; }
  button.ok { background:var(--ac2); }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .turma { display:flex; justify-content:space-between; align-items:center; padding:10px 12px; border:1px solid var(--line); border-radius:8px; margin-bottom:8px; cursor:pointer; }
  .turma.sel { border-color:var(--ac); background:#141b2e; }
  .tag { font-size:11px; padding:2px 7px; border-radius:20px; background:#243; color:#8fd; }
  .mat { border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:10px; }
  .mat .t { font-weight:600; }
  .mat .meta { font-size:12px; color:var(--mut); margin:2px 0 8px; }
  .resumo { background:#0f1218; border:1px solid var(--line); border-radius:8px; padding:4px 14px; margin-top:8px; font-size:14px; }
  .resumo h3 { font-size:14px; margin:12px 0 4px; color:var(--ac); }
  .resumo p { margin:8px 0; }
  .resumo ul { margin:4px 0 8px; padding-left:20px; }
  .resumo li { margin:3px 0; }
  .quiz { background:#0f1218; border:1px solid var(--line); border-radius:8px; padding:10px 14px; margin-top:8px; font-size:14px; }
  .qz-cab { color:var(--mut); font-size:13px; margin-bottom:8px; }
  .qz-q { border-top:1px solid var(--line); padding:10px 0; }
  .qz-enun { font-weight:600; margin-bottom:6px; }
  .qz-alts { list-style:none; margin:0; padding:0; }
  .qz-alts li { padding:3px 8px; border-radius:6px; margin:2px 0; }
  .qz-alts li.certa { background:#173a2a; color:#8fe0b5; }
  .qz-alts li.errada { background:#3a1d1d; color:#f6b1b1; }
  .qz-opt { display:block; color:var(--fg); font-size:14px; margin:4px 0; cursor:pointer; }
  .qz-opt input { width:auto; margin-right:4px; }
  .qz-fonte { font-size:12px; color:var(--mut); margin-top:6px; }
  .qz-res { font-size:12px; font-weight:600; margin-top:4px; }
  .qz-res.ok { color:var(--ac2); } .qz-res.no { color:#f6b1b1; }
  .qz-painel { border-top:1px solid var(--line); margin-top:10px; padding-top:10px; }
  .qz-painel ul { margin:4px 0 8px; padding-left:20px; }
  .qz-destaque { background:#3a2a14; color:#f6d38f; border-radius:6px; padding:6px 10px; margin:8px 0; font-weight:600; }
  .qz-sub { font-size:12px; color:var(--mut); margin-top:8px; }
  .msg { font-size:13px; padding:8px 12px; border-radius:8px; margin-bottom:12px; display:none; }
  .msg.err { background:#3a1d1d; color:#f6b1b1; display:block; }
  .msg.info { background:#1d2a3a; color:#a9cdf6; display:block; }
  .hidden { display:none; }
  .spin { color:var(--mut); font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Turmas</h1>
  <p class="sub">Vertical acadêmico do Echo — turma = círculo tipo <code>academia</code>. Página de teste do fluxo: criar turma → subir material → resumir com IA.</p>

  <div id="msg" class="msg"></div>

  <div class="card">
    <h2>Minhas turmas</h2>
    <div id="turmas"><span class="spin">carregando…</span></div>
    <div class="row" style="margin-top:12px">
      <input id="novaTurma" placeholder="Nome da nova turma (ex.: Banco de Dados II)" style="flex:1;min-width:200px">
      <button id="btnCriarTurma">Criar turma</button>
    </div>
  </div>

  <div id="painel" class="card hidden">
    <h2>Alunos de <span class="turmaNome"></span></h2>
    <div id="alunos"></div>
    <div id="addAluno" class="row hidden" style="margin-top:8px">
      <select id="amigoSel" style="flex:1;min-width:200px"></select>
      <button id="btnAddAluno" style="margin-top:0">Adicionar aluno</button>
    </div>

    <h2 style="margin-top:20px">Material de <span class="turmaNome"></span></h2>

    <div id="subir" class="hidden">
      <label>Nome do material</label>
      <input id="matTitulo" placeholder="ex.: Aula 5 — Normalização">
      <label>Texto do material (cole aqui)</label>
      <textarea id="matTexto" placeholder="Cole o conteúdo da aula, ou deixe vazio e envie um PDF abaixo."></textarea>
      <label>Ou envie um arquivo (PDF, TXT, MD, imagem — máx. 20MB)</label>
      <input id="matArquivo" type="file" accept=".pdf,.txt,.md,.jpg,.jpeg,.png,.webp">
      <button id="btnSubir">Subir material</button>
    </div>

    <div id="materiais" style="margin-top:16px"></div>
  </div>
</div>

<script src="js/turmas.js"></script>
</body>
</html>
