<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="assets/favicon.svg?v=20260920a" type="image/svg+xml" />
    <title>ECHO - Redefinir Senha</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <!-- Echo Core Stylesheet -->
    <link href="css/echo.css?v=20260924f" rel="stylesheet" />
</head>
<body>
    <div class="container-fluid auth-layout">
        <div class="row">
            <!-- LADO ESQUERDO (HERO) -->
            <div class="col-lg-7 d-none d-lg-flex auth-hero">
                <div>
                    <div class="auth-logo">
                        <i class="fa-solid fa-hashtag"></i>
                    </div>
                    <div class="auth-title">Nova Senha</div>
                    <div class="auth-subtitle">Crie uma senha forte e segura para proteger a sua conta ECHO.</div>

                    <div class="auth-highlight">
                        <p><i class="fa-solid fa-lock"></i> Crie senhas com pelo menos 6 caracteres.</p>
                        <p><i class="fa-solid fa-shield-halved"></i> Mantenha suas credenciais em segurança.</p>
                        <p><i class="fa-solid fa-check"></i> Redefinição instantânea e fácil.</p>
                    </div>
                </div>
            </div>

            <!-- LADO DIREITO (CARD DE RESET) -->
            <div class="col-lg-5 col-md-8 mx-auto auth-card-wrap">
                <div class="auth-card">
                    <h2>Criar nova senha</h2>
                    <p class="auth-card-sub">Informe e confirme sua nova senha de acesso.</p>

                    <!-- Banner de Feedback -->
                    <div id="feedbackBanner" style="display: none;"></div>

                    <!-- Formulário de Reset
                         data-enter: Enter em qualquer campo daqui clica o
                         botão indicado. Lido pelo listener no fim desta
                         página — duplicado de js/echo-ui.js porque esta tela
                         não carrega esse arquivo (ver toggleSenhaVisibilidade). -->
                    <div id="resetFormArea" data-enter="#btnSubmitReset">
                        <div class="mb-3">
                            <label class="form-label">Nova Senha</label>
                            <div class="input-icon-wrapper">
                                <i class="fa-solid fa-lock"></i>
                                <input id="newPassword" type="password" class="form-control pwd-field" placeholder="Mínimo 6 caracteres" />
                                <button type="button" class="password-toggle-btn" onclick="toggleSenhaVisibilidade(this)" aria-label="Mostrar senha">
                                    <i class="fa-solid fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Confirmar Nova Senha</label>
                            <div class="input-icon-wrapper">
                                <i class="fa-solid fa-shield-halved"></i>
                                <input id="confirmPassword" type="password" class="form-control pwd-field" placeholder="Digite novamente a senha" />
                                <button type="button" class="password-toggle-btn" onclick="toggleSenhaVisibilidade(this)" aria-label="Mostrar senha">
                                    <i class="fa-solid fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <button id="btnSubmitReset" class="btn btn-primary w-100 btn-auth" onclick="handleResetPassword()">
                            Redefinir Senha
                        </button>
                    </div>

                    <div class="auth-links">
                        <p>
                            <a href="index.html" class="text-info">
                                <i class="fa-solid fa-arrow-left me-1"></i>Voltar para o Login
                            </a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Alterna um campo de senha entre oculto e visivel (ver css .pwd-field
        // / .password-toggle-btn). Duplicado de js/echo-ui.js porque esta
        // pagina nao carrega esse arquivo.
        function toggleSenhaVisibilidade(btn) {
            const input = btn.previousElementSibling;
            if (!input) return;

            const icon = btn.querySelector("i");
            const vaiMostrar = input.type === "password";

            input.type = vaiMostrar ? "text" : "password";

            if (icon) {
                icon.classList.toggle("fa-eye", !vaiMostrar);
                icon.classList.toggle("fa-eye-slash", vaiMostrar);
            }

            btn.setAttribute("aria-label", vaiMostrar ? "Ocultar senha" : "Mostrar senha");
        }

        let resetToken = null;

        document.addEventListener("DOMContentLoaded", function () {
            const urlParams = new URLSearchParams(window.location.search);
            resetToken = urlParams.get("token");

            if (!resetToken) {
                showBanner("danger", "Link de redefinição inválido ou token ausente. Por favor, solicite um novo link de recuperação na tela de login.");
                document.getElementById("resetFormArea").style.display = "none";
            }
        });

        function showBanner(type, message) {
            const banner = document.getElementById("feedbackBanner");
            banner.className = `alert-custom alert-custom-${type}`;
            banner.innerHTML = `
                <i class="fa-solid ${type === 'danger' ? 'fa-triangle-exclamation' : (type === 'success' ? 'fa-circle-check' : 'fa-circle-info')}"></i>
                <div>${message}</div>
            `;
            banner.style.display = "flex";
        }

        async function handleResetPassword() {
            // Sem trim: espaco nas pontas faz parte da senha.
            const newPassword = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const btn = document.getElementById("btnSubmitReset");

            if (!newPassword || !confirmPassword) {
                showBanner("danger", "Preencha ambos os campos de senha.");
                return;
            }

            // Mesmo minimo que api/auth/reset_password.php exige.
            if (newPassword.length < 8) {
                showBanner("danger", "A nova senha deve ter pelo menos 8 caracteres.");
                return;
            }

            if (newPassword !== confirmPassword) {
                showBanner("danger", "As senhas digitadas não coincidem.");
                return;
            }

            // Ativa spinner no botão
            btn.disabled = true;
            btn.innerHTML = `<span class="spinner-echo me-2" style="width:16px;height:16px;border-width:2px;"></span>Redefinindo...`;

            try {
                const res = await fetch("api/auth/reset_password.php", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "same-origin",
                    body: JSON.stringify({
                        token: resetToken,
                        new_password: newPassword
                    })
                });

                const data = await res.json();

                if (data.error) {
                    showBanner("danger", data.error);
                    btn.disabled = false;
                    btn.innerHTML = "Redefinir Senha";
                    return;
                }

                showBanner("success", "Sua senha foi alterada com sucesso! Redirecionando para o login...");
                document.getElementById("resetFormArea").style.display = "none";
                setTimeout(() => { window.location = "index.html"; }, 2000);
            } catch (e) {
                showBanner("danger", "Erro de conexão ao redefinir a senha.");
                btn.disabled = false;
                btn.innerHTML = "Redefinir Senha";
            }
        }

        // Enter em qualquer campo de uma linha do bloco marcado com
        // data-enter clica o botao indicado. Duplicado de js/echo-ui.js
        // pelo mesmo motivo de toggleSenhaVisibilidade: esta pagina nao
        // carrega aquele arquivo.
        document.addEventListener("keydown", function (ev) {
            if (ev.key !== "Enter" || ev.isComposing) return;
            if (ev.shiftKey || ev.ctrlKey || ev.altKey || ev.metaKey) return;
            if (!(ev.target instanceof HTMLInputElement)) return;

            const escopo = ev.target.closest("[data-enter]");
            if (!escopo) return;

            const botao = escopo.querySelector(escopo.dataset.enter);
            if (!botao || botao.disabled) return;

            ev.preventDefault();
            botao.click();
        });
    </script>
</body>
</html>
