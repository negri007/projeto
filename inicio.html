<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECHO - Início</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="css/echo.css" rel="stylesheet">
</head>
<body>
<div class="container-fluid layout">
    <div class="row">
        <!-- SIDEBAR (DESKTOP / TABLET) -->
        <aside class="col-lg-2 col-md-3 d-none d-md-flex flex-column sidebar">
            <div class="logo d-flex align-items-center gap-2">
                <div class="logo-mark">
                    <i class="fa-solid fa-hashtag"></i>
                </div>
                <span class="logo-text">ECHO</span>
            </div>

            <nav class="nav flex-column mb-3">
                <a class="nav-link" href="explorar.html">
                    <i class="fa-solid fa-magnifying-glass"></i><span>Explorar</span>
                </a>
                <a class="nav-link active" href="inicio.html">
                    <i class="fa-solid fa-house"></i><span>Início</span>
                </a>
                <a class="nav-link" href="perfil.html">
                    <i class="fa-solid fa-user"></i><span>Perfil</span>
                </a>
                <a class="nav-link" href="salvos.html">
                    <i class="fa-regular fa-bookmark"></i><span>Salvos</span>
                </a>
                <a class="nav-link" href="circulos.html">
                    <i class="fa-regular fa-circle"></i><span>Círculos</span>
                </a>
                <a class="nav-link" href="amigos.html">
                    <i class="fa-solid fa-user-group"></i><span>Amigos</span>
                </a>
                <a class="nav-link" href="chat.html">
                    <i class="fa-solid fa-comments"></i><span>Mensagens</span>
                </a>
            </nav>

            <!-- mini perfil -->
            <div class="sidebar-profile d-flex align-items-center gap-2">
                <div class="prof-avatar">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div class="prof-info flex-grow-1">
                    <div class="prof-name" id="sidebarName">Usuário</div>
                    <div class="prof-handle" id="sidebarHandle">@usuario</div>
                </div>
                <button class="btn btn-sm btn-outline-secondary rounded-pill" onclick="logout()" title="Sair">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                </button>
            </div>
        </aside>

        <!-- COLUNA CENTRAL (FEED INÍCIO) -->
        <main class="col-lg-7 col-md-9 main-col">
            <div class="main-header">
                <div class="d-flex align-items-center gap-2">
                    <button class="mobile-header-toggle" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileSidebarOffcanvas">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <span class="main-header-title">Início</span>
                    <span class="badge bg-secondary-subtle text-light border border-secondary badge-pill" id="badgeEscopo">Amigos</span>
                </div>

                <div class="d-flex align-items-center gap-2">
                    <div class="search-box d-none d-sm-block">
                        <input type="text" class="form-control form-control-sm" placeholder="Buscar no ECHO">
                    </div>
                    <!-- SINO DE NOTIFICAÇÕES -->
                    <div id="notificationBellContainer"></div>
                </div>
            </div>

            <!-- Caixa de post -->
            <div class="tweet-box">
                <div class="tweet-avatar">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div class="flex-grow-1">
                    <textarea id="postText" placeholder="O que está acontecendo? Use #etiqueta e @pessoa"></textarea>

                    <div class="image-preview" id="imagePreview"></div>

                    <div class="tweet-toolbar">
                        <div>
                            <button class="icon-btn" type="button" onclick="document.getElementById('imageInput').click()" title="Adicionar Imagem">
                                <i class="fa-regular fa-image"></i>
                            </button>
                            <button class="icon-btn" type="button" title="Citar alguém" onclick="inserirArroba()">
                                <i class="fa-solid fa-at"></i>
                            </button>
                        </div>
                        <button class="btn btn-primary rounded-pill px-4 py-1" id="btnPostar" onclick="createPost()">Postar</button>
                    </div>

                    <input type="file" id="imageInput" accept="image/*" class="d-none">
                </div>
            </div>

            <!-- Alternador do feed: a sua roda por padrão, a rede inteira
                 a um toque. O Explorar não repete nenhum dos dois: lá a
                 ordem é por engajamento, não por data. -->
            <div class="echo-switch">
                <button type="button" id="btnEscopoAmigos" class="active" onclick="trocarEscopo('friends')">
                    <i class="fa-solid fa-user-group me-1"></i>Amigos
                </button>
                <button type="button" id="btnEscopoTodos" onclick="trocarEscopo('all')">
                    <i class="fa-solid fa-globe me-1"></i>Todos
                </button>
            </div>

            <!-- Feed Container -->
            <div id="feedContainer"></div>
        </main>

        <!-- COLUNA DIREITA -->
        <aside class="col-lg-3 d-none d-lg-block right-col">
            <div class="right-card">
                <h5>Assuntos em alta</h5>
                <!-- Preenchido por EchoUIInstance.renderTrending() com as
                     etiquetas reais dos últimos 7 dias. -->
                <div id="trendingCard">
                    <p class="text-secondary mb-0 small">Carregando tendências...</p>
                </div>
            </div>

            <div class="right-card">
                <h5>Seus círculos</h5>
                <div id="circlesCard">
                    <p class="text-secondary mb-0 small">Carregando círculos...</p>
                </div>
            </div>
        </aside>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/echo-ui.js"></script>
<script src="js/echo-feed.js"></script>

<script>
let currentUser = null;
let selectedImageFile = null;
let feed = null;

const imageInput   = document.getElementById("imageInput");
const imagePreview = document.getElementById("imagePreview");

document.addEventListener("DOMContentLoaded", async function () {
    // Checagem de autenticação via sessão PHP (GET /api/auth/me.php)
    currentUser = await EchoUIInstance.checkAuth({ redirectOnFail: true });
    if (!currentUser) return;

    // Inicializa Header (Sino + Mobile Offcanvas + Busca global)
    document.getElementById('notificationBellContainer').innerHTML = EchoUIInstance.getNotificationBellHTML();
    EchoUIInstance.initHeader('inicio');

    // O feed inteiro (lista, ações, comentários) vem de js/echo-feed.js:
    // é o mesmo componente de explorar, perfil e salvos.
    feed = EchoFeed.create({
        container: "feedContainer",
        params: { limit: 10, scope: "friends" },
        emptyText: textoVazio("friends")
    });
    feed.load();

    EchoUIInstance.attachMentionAutocomplete(document.getElementById("postText"));
    EchoUIInstance.renderTrending();
    EchoUIInstance.renderMyCircles();
});

imageInput.addEventListener("change", function () {
    const file = this.files[0];
    selectedImageFile = null;
    imagePreview.innerHTML = "";

    if (!file) return;

    selectedImageFile = file;
    const url = URL.createObjectURL(file);
    imagePreview.innerHTML = `<img src="${url}" alt="Pré-visualização">`;
});

function logout() {
    EchoUIInstance.logout();
}

/**
 * Alterna entre a sua roda (você + amigos) e a rede inteira.
 *
 * O padrão é "Amigos" porque é isso que separa o Início do Explorar: um
 * é o que a sua roda escreveu, em ordem de tempo; o outro é o que a rede
 * achou interessante, em ordem de engajamento.
 */
let escopoAtual = "friends";

function trocarEscopo(escopo) {
    if (escopo === escopoAtual) return;

    escopoAtual = escopo;

    document.getElementById("btnEscopoAmigos").classList.toggle("active", escopo === "friends");
    document.getElementById("btnEscopoTodos").classList.toggle("active", escopo === "all");
    document.getElementById("badgeEscopo").textContent = escopo === "friends" ? "Amigos" : "Todos";

    feed.emptyText = textoVazio(escopo);
    // `scope` só vai na requisição no modo amigos; sem ele, o servidor
    // devolve o feed inteiro.
    feed.setParams(escopo === "friends" ? { limit: 10, scope: "friends" } : { limit: 10 });
}

function textoVazio(escopo) {
    return escopo === "friends"
        ? "Sua roda está quieta. Publique algo, ou use o Explorar para achar gente nova."
        : "Ninguém publicou nada ainda. Seja o primeiro!";
}

/** Atalho do botão "@": abre o autocomplete sem precisar digitar. */
function inserirArroba() {
    const campo = document.getElementById("postText");
    campo.focus();
    campo.setRangeText("@", campo.selectionStart, campo.selectionEnd, "end");
    campo.dispatchEvent(new Event("input"));
}

async function createPost() {
    const campo = document.getElementById("postText");
    const txt = campo.value.trim();

    if (!txt && !selectedImageFile) {
        EchoUIInstance.toast("Escreva algo ou anexe uma imagem para publicar.", "info");
        campo.focus();
        return;
    }

    const fd = new FormData();
    fd.append("content", txt);
    if (selectedImageFile) {
        fd.append("image", selectedImageFile);
    }

    // Trava o botao enquanto envia: sem isso, clique duplo publicava o
    // mesmo post duas vezes.
    const btn = document.getElementById("btnPostar");
    const rotulo = btn ? btn.innerHTML : "";

    if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<span class="spinner-echo me-2" style="width:14px;height:14px;border-width:2px;"></span>Publicando...`;
    }

    try {
        const res = await fetch("api/posts/create.php", {
            method: "POST",
            credentials: "same-origin",
            body: fd
        });

        const data = await res.json();

        if (EchoUIInstance.showApiError(data)) return;

        campo.value = "";
        imageInput.value = "";
        selectedImageFile = null;
        imagePreview.innerHTML = "";

        EchoUIInstance.toastSuccess("Publicado!");
        feed.load();
        // Etiqueta nova no post muda a tendência do momento.
        EchoUIInstance.renderTrending();
    } catch (e) {
        EchoUIInstance.toastError("Erro de conexão ao publicar.");
    } finally {
        if (btn) {
            btn.disabled = false;
            btn.innerHTML = rotulo;
        }
    }
}
</script>
</body>
</html>
