<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECHO - Mensagens</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="css/echo.css" rel="stylesheet">

    <style>
        .chat-wrapper {
            display: flex;
            height: calc(100vh - 65px);
        }

        .friends-list {
            width: 280px;
            border-right: 1px solid var(--border-soft);
            overflow-y: auto;
            background-color: var(--bg-card);
        }

        .friend-item {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-soft);
            cursor: pointer;
            transition: background-color var(--transition-fast);
        }

        .friend-item:hover, .friend-item.active {
            background: rgba(29, 155, 240, 0.1);
        }

        .friend-avatar {
            background: var(--bg-input);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-soft);
            color: var(--text-soft);
            flex-shrink: 0;
        }

        .friend-name {
            font-weight: 700;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-main);
        }

        .chat-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-soft);
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-card-alt);
        }

        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: var(--radius-lg);
            background: var(--bg-card);
            border: 1px solid var(--border-soft);
            color: var(--text-main);
            align-self: flex-start;
            word-break: break-word;
        }

        .msg-me {
            align-self: flex-end;
            background: var(--accent-hover);
            border-color: var(--accent);
        }

        .chat-input-area {
            padding: 14px 16px;
            border-top: 1px solid var(--border-soft);
            display: flex;
            gap: 10px;
            background: var(--bg-card-alt);
        }
    </style>
</head>
<body>
<div class="container-fluid layout">
    <div class="row">
        <!-- SIDEBAR -->
        <aside class="col-lg-2 col-md-3 d-none d-md-flex flex-column sidebar">
            <div class="logo d-flex align-items-center gap-2">
                <div class="logo-mark">
                    <i class="fa-solid fa-hashtag"></i>
                </div>
                <span class="logo-text">ECHO</span>
            </div>

            <nav class="nav flex-column mb-3">
                <a class="nav-link" href="explorar.html"><i class="fa-solid fa-magnifying-glass"></i><span>Explorar</span></a>
                <a class="nav-link" href="inicio.html"><i class="fa-solid fa-house"></i><span>Início</span></a>
                <a class="nav-link" href="perfil.html"><i class="fa-solid fa-user"></i><span>Perfil</span></a>
                <a class="nav-link" href="rede_ia.html">
                    <i class="fa-solid fa-robot"></i><span>Rede IA</span>
                </a>
                <a class="nav-link" href="salvos.html">
                    <i class="fa-regular fa-bookmark"></i><span>Salvos</span>
                </a>
                <a class="nav-link" href="circulos.html"><i class="fa-regular fa-circle"></i><span>Círculos</span></a>
                <a class="nav-link" href="amigos.html"><i class="fa-solid fa-user-group"></i><span>Amigos</span></a>
                <a class="nav-link active" href="chat.html"><i class="fa-solid fa-comments"></i><span>Mensagens</span></a>
            </nav>

            <div class="sidebar-profile d-flex align-items-center gap-2">
                <div class="prof-avatar"><i class="fa-solid fa-user"></i></div>
                <div class="prof-info flex-grow-1">
                    <div class="prof-name" id="sidebarName">Usuário</div>
                    <div class="prof-handle" id="sidebarHandle">@user</div>
                </div>
                <button class="btn btn-sm btn-outline-secondary rounded-pill" onclick="logout()" title="Sair">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                </button>
            </div>
        </aside>

        <!-- CHAT AREA -->
        <main class="col-lg-10 col-md-9 p-0 main-col">
            <div class="main-header border-bottom border-secondary px-3 py-2">
                <div class="d-flex align-items-center gap-2">
                    <button class="mobile-header-toggle" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileSidebarOffcanvas">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <span class="main-header-title">Mensagens Privadas</span>
                </div>

                <!-- SINO DE NOTIFICAÇÕES -->
                <div id="notificationBellContainer"></div>
            </div>

            <div class="chat-wrapper">
                <!-- Lista de amigos -->
                <div class="friends-list" id="friendsList"></div>

                <!-- Área do chat -->
                <div class="chat-area">
                    <div class="chat-header">
                        <div class="friend-avatar"><i class="fa-solid fa-user"></i></div>
                        <h6 id="chatTitle" class="m-0 fw-bold">Selecione uma conversa ao lado</h6>
                    </div>

                    <div class="chat-messages" id="messagesBox">
                        <div class="text-center my-auto text-secondary">
                            <i class="fa-regular fa-comments display-4 d-block mb-2 text-muted"></i>
                            Escolha um contato para iniciar uma conversa.
                        </div>
                    </div>

                    <div class="chat-input-area">
                        <input type="text" class="form-control form-control-sm rounded-pill" id="msgInput" placeholder="Digite uma mensagem..." disabled onkeypress="if(event.key==='Enter') sendMessage()">
                        <button class="btn btn-primary btn-sm rounded-pill px-4" onclick="sendMessage()" id="btnSend" disabled>
                            <i class="fa-solid fa-paper-plane me-1"></i>Enviar
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/echo-ui.js"></script>

<script>
let currentUser = null;
// A conversa aberta e identificada pelo ID do amigo - o contrato de
// mensagens nao aceita mais e-mail como identidade.
let currentFriendId = null;
let intervalMessages = null;
// Ultimo ID renderizado: evita repintar a conversa inteira a cada ciclo
// do poller, o que fazia a tela piscar e perder a posicao do scroll.
let lastMessageId = 0;
// Recarrega a lista lateral de tempos em tempos para o badge de nao
// lidas acompanhar mensagem que chega enquanto a tela esta aberta.
let intervalConversas = null;

document.addEventListener("DOMContentLoaded", async function () {
    // Checagem de autenticação via sessão PHP (GET /api/auth/me.php)
    currentUser = await EchoUIInstance.checkAuth({ redirectOnFail: true });
    if (!currentUser) return;

    // Inicializa Header (Sino + Mobile Sidebar)
    document.getElementById('notificationBellContainer').innerHTML = EchoUIInstance.getNotificationBellHTML();
    EchoUIInstance.initHeader('chat');

    await loadFriends();

    // Atalho vindo do perfil de alguem: perfil.html -> chat.html?friend=ID
    const friendParam = Number(new URLSearchParams(window.location.search).get("friend"));

    if (friendParam) {
        const item = document.getElementById("friend-item-" + friendParam);
        openChat(friendParam, item?.dataset.nome || "Conversa");
    }

    intervalConversas = setInterval(loadFriends, 15000);
});

function logout() {
    EchoUIInstance.logout();
}

/**
 * Lista lateral de conversas: um item por amigo, com a ultima mensagem e
 * quantas ainda nao foram lidas. Vem tudo de `conversations.php` numa
 * chamada so — antes eram os amigos crus, sem previa nem nao lidas.
 */
async function loadFriends() {
    const box = document.getElementById("friendsList");
    const primeiraCarga = box.children.length === 0;

    if (primeiraCarga) box.innerHTML = EchoUIInstance.getListSkeletonHTML(3);

    try {
        const res = await fetch("api/messages/conversations.php", { credentials: "same-origin" });
        const data = await res.json();

        if (data.error) {
            box.innerHTML = `<p class='text-danger p-3 text-center small'>${EchoUIInstance.escapeHTML(data.error)}</p>`;
            return;
        }

        const conversas = data.conversations || [];
        box.innerHTML = "";

        if (conversas.length === 0) {
            box.innerHTML = "<p class='text-secondary p-3 text-center small'>Você ainda não possui amigos. Adicione conexões para conversar.</p>";
            return;
        }

        conversas.forEach(c => {
            const item = document.createElement("div");
            const temNaoLida = c.unread_count > 0 && c.user_id !== currentFriendId;

            item.className = "friend-item" + (temNaoLida ? " tem-nao-lida" : "")
                           + (c.user_id === currentFriendId ? " active" : "");
            item.id = "friend-item-" + c.user_id;
            item.dataset.nome = c.name;
            item.onclick = () => openChat(c.user_id, c.name);

            // Previa: "Você: ..." quando a ultima mensagem foi minha.
            const previa = c.last_body
                ? (c.last_is_mine ? "Você: " : "") + c.last_body
                : "Nenhuma mensagem ainda";

            item.innerHTML = `
                ${EchoUIInstance.avatarHTML(c, "sm")}
                <div class="flex-grow-1 min-width-0">
                    <div class="friend-name">${EchoUIInstance.escapeHTML(c.name)}</div>
                    <div class="friend-preview">${EchoUIInstance.escapeHTML(previa)}</div>
                </div>
                ${temNaoLida ? `<span class="echo-unread-badge">${c.unread_count}</span>` : ""}
            `;
            box.appendChild(item);
        });

        atualizarTituloNaoLidas(data.unread_total);
    } catch(e) {
        if (primeiraCarga) {
            box.innerHTML = "<p class='text-danger p-3 text-center small'>Erro ao carregar lista de conversas.</p>";
        }
    }
}

/** Mostra as nao lidas no titulo da aba, para quem esta em outra janela. */
function atualizarTituloNaoLidas(total) {
    document.title = total > 0 ? `(${total}) ECHO - Mensagens` : "ECHO - Mensagens";
}

function openChat(friendId, name) {
    currentFriendId = Number(friendId);
    lastMessageId = 0;
    document.getElementById("chatTitle").textContent = name || "Conversa";
    document.getElementById("messagesBox").innerHTML = "";

    // O badge da conversa aberta sai na hora; `list.php` marca como
    // lidas no servidor logo em seguida.
    const item = document.getElementById("friend-item-" + currentFriendId);
    item?.classList.remove("tem-nao-lida");
    item?.querySelector(".echo-unread-badge")?.remove();

    document.getElementById("msgInput").disabled = false;
    document.getElementById("btnSend").disabled = false;

    document.querySelectorAll('.friend-item').forEach(el => el.classList.remove('active'));
    const activeItem = document.getElementById("friend-item-" + currentFriendId);
    if (activeItem) activeItem.classList.add('active');

    loadMessages();

    if (intervalMessages) clearInterval(intervalMessages);
    intervalMessages = setInterval(loadMessages, 3000);
}

async function loadMessages() {
    if (!currentFriendId) return;

    const box = document.getElementById("messagesBox");

    try {
        const res = await fetch(
            "api/messages/list.php?friend=" + encodeURIComponent(currentFriendId),
            { credentials: "same-origin" }
        );
        const data = await res.json();

        if (data.error) {
            // Sem amizade aceita o back recusa a conversa: mostrar o
            // motivo real, nao "nenhuma mensagem".
            if (intervalMessages) clearInterval(intervalMessages);
            box.innerHTML = `<p class="text-danger text-center my-auto small">${EchoUIInstance.escapeHTML(data.error)}</p>`;
            return;
        }

        const messages = data.messages || [];

        if (messages.length === 0) {
            box.innerHTML = "<p class='text-secondary text-center my-auto small'>Nenhuma mensagem trocada ainda.</p>";
            lastMessageId = 0;
            return;
        }

        // So as mensagens novas entram na tela; o resto continua onde
        // esta, preservando a posicao de scroll de quem esta lendo.
        const novas = messages.filter(m => Number(m.id) > lastMessageId);
        if (novas.length === 0) return;

        if (lastMessageId === 0) box.innerHTML = "";

        const grudadoNoFim = box.scrollTop + box.clientHeight >= box.scrollHeight - 40;

        novas.forEach(msg => {
            // "E minha?" se decide por user_id, nunca por e-mail.
            const isMe = Number(msg.user_id) === Number(currentUser.id);
            const div = document.createElement("div");
            div.className = "msg " + (isMe ? "msg-me" : "");
            div.textContent = msg.body;
            div.title = msg.created_at;
            box.appendChild(div);
            lastMessageId = Math.max(lastMessageId, Number(msg.id));
        });

        if (grudadoNoFim) box.scrollTop = box.scrollHeight;

        // Mensagem nova de outra conversa tambem precisa aparecer na
        // lista lateral, nao so na conversa aberta.
        loadFriends();
    } catch(e) {
        console.error("Erro ao carregar mensagens:", e);
    }
}

async function sendMessage() {
    const input = document.getElementById("msgInput");
    const text  = input.value.trim();
    if (!text || !currentFriendId) return;

    const btn = document.getElementById("btnSend");
    btn.disabled = true;

    try {
        const res = await fetch("api/messages/send.php", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "same-origin",
            body: JSON.stringify({ user_id: currentFriendId, body: text })
        });
        const data = await res.json();

        if (data.error) {
            EchoUIInstance.toastError(data.error);
            return;
        }

        input.value = "";
        loadMessages();
    } catch (e) {
        EchoUIInstance.toastError("Erro ao enviar mensagem. Tente novamente.");
    } finally {
        btn.disabled = false;
        input.focus();
    }
}
</script>
</body>
</html>
