<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECHO - Mensagens</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="css/echo.css" rel="stylesheet">

    <style>
        .chat-wrapper {
            display: flex;
            height: calc(100vh - 65px);
        }

        .friends-list {
            width: 280px;
            border-right: 1px solid var(--border-soft);
            overflow-y: auto;
            background-color: var(--bg-card);
        }

        .friend-item {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-soft);
            cursor: pointer;
            transition: background-color var(--transition-fast);
        }

        .friend-item:hover, .friend-item.active {
            background: rgba(29, 155, 240, 0.1);
        }

        .friend-avatar {
            background: var(--bg-input);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-soft);
            color: var(--text-soft);
            flex-shrink: 0;
        }

        .friend-name {
            font-weight: 700;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-main);
        }

        .chat-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-soft);
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-card-alt);
        }

        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: var(--radius-lg);
            background: var(--bg-card);
            border: 1px solid var(--border-soft);
            color: var(--text-main);
            align-self: flex-start;
            word-break: break-word;
        }

        .msg-me {
            align-self: flex-end;
            background: var(--accent-hover);
            border-color: var(--accent);
        }

        .chat-input-area {
            padding: 14px 16px;
            border-top: 1px solid var(--border-soft);
            display: flex;
            gap: 10px;
            background: var(--bg-card-alt);
        }
    </style>
</head>
<body>
<div class="container-fluid layout">
    <div class="row">
        <!-- SIDEBAR -->
        <aside class="col-lg-2 col-md-3 d-none d-md-flex flex-column sidebar">
            <div class="logo d-flex align-items-center gap-2">
                <div class="logo-mark">
                    <i class="fa-solid fa-hashtag"></i>
                </div>
                <span class="logo-text">ECHO</span>
            </div>

            <nav class="nav flex-column mb-3">
                <a class="nav-link" href="explorar.html"><i class="fa-solid fa-magnifying-glass"></i><span>Explorar</span></a>
                <a class="nav-link" href="inicio.html"><i class="fa-solid fa-house"></i><span>Início</span></a>
                <a class="nav-link" href="perfil.html"><i class="fa-solid fa-user"></i><span>Perfil</span></a>
                <a class="nav-link" href="circulos.html"><i class="fa-regular fa-circle"></i><span>Círculos</span></a>
                <a class="nav-link" href="amigos.html"><i class="fa-solid fa-user-group"></i><span>Amigos</span></a>
                <a class="nav-link active" href="chat.html"><i class="fa-solid fa-comments"></i><span>Mensagens</span></a>
            </nav>

            <div class="sidebar-profile d-flex align-items-center gap-2">
                <div class="prof-avatar"><i class="fa-solid fa-user"></i></div>
                <div class="prof-info flex-grow-1">
                    <div class="prof-name" id="sidebarName">Usuário</div>
                    <div class="prof-handle" id="sidebarHandle">@user</div>
                </div>
                <button class="btn btn-sm btn-outline-secondary rounded-pill" onclick="logout()" title="Sair">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                </button>
            </div>
        </aside>

        <!-- CHAT AREA -->
        <main class="col-lg-10 col-md-9 p-0 main-col">
            <div class="main-header border-bottom border-secondary px-3 py-2">
                <div class="d-flex align-items-center gap-2">
                    <button class="mobile-header-toggle" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileSidebarOffcanvas">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <span class="main-header-title">Mensagens Privadas</span>
                </div>

                <!-- SINO DE NOTIFICAÇÕES -->
                <div id="notificationBellContainer"></div>
            </div>

            <div class="chat-wrapper">
                <!-- Lista de amigos -->
                <div class="friends-list" id="friendsList"></div>

                <!-- Área do chat -->
                <div class="chat-area">
                    <div class="chat-header">
                        <div class="friend-avatar"><i class="fa-solid fa-user"></i></div>
                        <h6 id="chatTitle" class="m-0 fw-bold">Selecione uma conversa ao lado</h6>
                    </div>

                    <div class="chat-messages" id="messagesBox">
                        <div class="text-center my-auto text-secondary">
                            <i class="fa-regular fa-comments display-4 d-block mb-2 text-muted"></i>
                            Escolha um contato para iniciar uma conversa.
                        </div>
                    </div>

                    <div class="chat-input-area">
                        <input type="text" class="form-control form-control-sm rounded-pill" id="msgInput" placeholder="Digite uma mensagem..." disabled onkeypress="if(event.key==='Enter') sendMessage()">
                        <button class="btn btn-primary btn-sm rounded-pill px-4" onclick="sendMessage()" id="btnSend" disabled>
                            <i class="fa-solid fa-paper-plane me-1"></i>Enviar
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/echo-ui.js"></script>

<script>
let currentUser = null;
let userEmail = "";
let currentChat = null;
let intervalMessages = null;

document.addEventListener("DOMContentLoaded", async function () {
    // Checagem de autenticação via sessão PHP (GET /api/auth/me.php)
    currentUser = await EchoUIInstance.checkAuth({ redirectOnFail: true });
    if (!currentUser) return;

    userEmail = currentUser.email;

    // Inicializa Header (Sino + Mobile Sidebar)
    document.getElementById('notificationBellContainer').innerHTML = EchoUIInstance.getNotificationBellHTML();
    EchoUIInstance.initHeader('chat');

    loadFriends();
});

function logout() {
    EchoUIInstance.logout();
}

async function loadFriends() {
    const box = document.getElementById("friendsList");
    box.innerHTML = EchoUIInstance.getListSkeletonHTML(3);

    try {
        const res = await fetch("api/friends/list.php", { credentials: "same-origin" });
        const data = await res.json();

        box.innerHTML = "";

        if (!data.ok || !data.friends || data.friends.length === 0) {
            box.innerHTML = "<p class='text-secondary p-3 text-center small'>Você ainda não possui amigos. Adicione conexões para conversar.</p>";
            return;
        }

        data.friends.forEach(f => {
            const html = `
                <div class="friend-item" id="friend-item-${f.email.replace(/[@.]/g, '_')}" onclick="openChat('${EchoUIInstance.escapeHTML(f.email)}', '${EchoUIInstance.escapeHTML(f.name)}')">
                    <div class="friend-avatar"><i class="fa-solid fa-user"></i></div>
                    <div>
                        <div class="friend-name">${EchoUIInstance.escapeHTML(f.name)}</div>
                        <small class="text-secondary">@${EchoUIInstance.escapeHTML(f.email.split("@")[0])}</small>
                    </div>
                </div>
            `;
            box.innerHTML += html;
        });
    } catch(e) {
        box.innerHTML = "<p class='text-danger p-3 text-center small'>Erro ao carregar lista de conversas.</p>";
    }
}

function openChat(email, name) {
    currentChat = email;
    document.getElementById("chatTitle").textContent = name ? `${name} (@${email.split("@")[0]})` : email;

    document.getElementById("msgInput").disabled = false;
    document.getElementById("btnSend").disabled = false;

    document.querySelectorAll('.friend-item').forEach(el => el.classList.remove('active'));
    const activeItem = document.getElementById(`friend-item-${email.replace(/[@.]/g, '_')}`);
    if (activeItem) activeItem.classList.add('active');

    loadMessages();

    if (intervalMessages) clearInterval(intervalMessages);
    intervalMessages = setInterval(loadMessages, 2000);
}

async function loadMessages() {
    if (!currentChat) return;

    try {
        const res = await fetch(`api/messages/list.php?me=${encodeURIComponent(userEmail)}&friend=${encodeURIComponent(currentChat)}`);
        const data = await res.json();

        const box = document.getElementById("messagesBox");
        
        if (!Array.isArray(data) || data.length === 0) {
            box.innerHTML = "<p class='text-secondary text-center my-auto small'>Nenhuma mensagem trocada ainda.</p>";
            return;
        }

        box.innerHTML = "";
        data.forEach(msg => {
            const isMe = msg.sender === userEmail;
            const div = document.createElement("div");

            div.className = "msg " + (isMe ? "msg-me" : "");
            div.textContent = msg.body;

            box.appendChild(div);
        });

        box.scrollTop = box.scrollHeight;
    } catch(e) {
        console.error(e);
    }
}

async function sendMessage() {
    const text = document.getElementById("msgInput").value.trim();
    if (!text || !currentChat) return;

    await fetch("api/messages/send.php", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            sender: userEmail,
            receiver: currentChat,
            body: text
        })
    });

    document.getElementById("msgInput").value = "";
    loadMessages();
}
</script>
</body>
</html>
