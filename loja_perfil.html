<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" href="assets/favicon.svg?v=20260920a" type="image/svg+xml">
    <title>ECHO - Loja</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="css/echo.css?v=20260930d" rel="stylesheet">
</head>
<body>
<div class="container-fluid layout">
    <div class="row">
        <!-- SIDEBAR -->
        <aside class="col-lg-2 col-md-3 d-none d-md-flex flex-column sidebar" id="echoSidebar"></aside>

        <main class="col-lg-7 col-md-9 main-col">
            <div class="main-header">
                <div class="d-flex align-items-center gap-2">
                    <button class="mobile-header-toggle" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileSidebarOffcanvas">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <span class="main-header-title">Loja</span>
                </div>

                <div class="d-flex align-items-center gap-2">
                    <div class="search-box d-none d-sm-block">
                        <input type="text" class="form-control form-control-sm" placeholder="Buscar no ECHO">
                    </div>
                    <div id="notificationBellContainer"></div>
                </div>
            </div>

            <div id="lojaCapa" class="loja-capa"></div>

            <div class="loja-secao">
                <h3 class="loja-secao-titulo">
                    <i class="fa-solid fa-box"></i>Produtos
                    <span class="loja-secao-conta" id="contaProdutos"></span>
                </h3>
                <div id="lojaProdutos" class="loja-grade"></div>
            </div>

            <div class="loja-secao">
                <h3 class="loja-secao-titulo">
                    <i class="fa-regular fa-newspaper"></i>Publicações
                    <!-- Sem contagem aqui de propósito: o feed vem paginado,
                         e o número seria o da primeira página, não o total. -->
                </h3>
                <div id="lojaPosts"></div>
            </div>

            <!-- Report da loja, discreto no rodape: quem entra aqui vem
                 comprar, nao denunciar. -->
            <div class="loja-rodape">
                <button type="button" class="loja-report-link" id="reportarLoja">
                    <i class="fa-regular fa-flag"></i> Reportar esta loja
                </button>
            </div>

        </main>

        <!-- COLUNA DIREITA -->
        <aside class="col-lg-3 d-none d-lg-block right-col">
            <div class="right-card">
                <h5>Contato</h5>
                <div id="lojaContato">
                    <p class="text-secondary mb-0 small">Carregando...</p>
                </div>
            </div>

            <div class="right-card" data-dobravel="como-compra-funciona">
                <h5>Como a compra funciona</h5>
                <small class="text-secondary">
                    Você monta o carrinho aqui e finaliza pelo WhatsApp da loja.
                    O pedido vai pronto, com itens e total.
                    <br><br>
                    O Echo não processa pagamento: o acerto é direto com quem vende.
                </small>
            </div>

        </aside>
    </div>
</div>
<!-- Carrinho flutuante. `position: fixed` no canto inferior direito, com
     z-index abaixo de modal e toast: ele nao pode tapar a confirmacao de
     uma acao que ele mesmo disparou. -->
<button type="button" class="loja-carrinho-flutuante" id="carrinhoBotao" hidden>
    <i class="fa-solid fa-basket-shopping"></i>
    <span class="loja-carrinho-badge" id="carrinhoBadge">0</span>
</button>

<!-- Botao de falar com a loja: flutuante no desktop, fixo no rodape no
     celular (ver o CSS). -->
<a class="loja-falar-flutuante" id="falarLoja" href="#">
    <i class="fa-solid fa-comments"></i><span>Falar com a loja</span>
</a>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/echo-ui.js?v=20260929b"></script>
<script src="js/echo-bit.js?v=20260920a"></script>
<script src="js/loja-feed.js?v=20260928a"></script>
<script src="js/loja-perfil.js?v=20260924b"></script>
</body>
</html>
