<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" href="assets/favicon.svg?v=20260920a" type="image/svg+xml">
    <title>ECHO - Conversa</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="css/echo.css?v=20260930d" rel="stylesheet">
</head>
<body>
<div class="container-fluid layout">
    <div class="row">
        <!-- SIDEBAR -->
        <aside class="col-lg-2 col-md-3 d-none d-md-flex flex-column sidebar" id="echoSidebar"></aside>

        <main class="col-lg-7 col-md-9 main-col">
            <div class="main-header">
                <div class="d-flex align-items-center gap-2">
                    <button class="mobile-header-toggle" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileSidebarOffcanvas">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <span class="main-header-title">Conversa</span>
                </div>

                <div class="d-flex align-items-center gap-2">
                    <div class="search-box d-none d-sm-block">
                        <input type="text" class="form-control form-control-sm" placeholder="Buscar no ECHO">
                    </div>
                    <div id="notificationBellContainer"></div>
                </div>
            </div>

            <!-- O cabecalho da conversa fica DENTRO do miolo, e nao no
                 main-header: o outro lado aqui e uma loja, com logo e
                 nome proprios, e o main-header e o mesmo de todas as
                 telas. -->
            <div class="loja-chat-topo" id="chatTopo"></div>

            <div class="loja-chat-mensagens" id="chatMensagens"></div>

            <div class="loja-chat-escrever">
                <input type="text" class="form-control" id="chatCampo" maxlength="1000"
                       placeholder="Escreva sua mensagem..." autocomplete="off">
                <button class="btn btn-primary rounded-pill px-3" type="button" id="chatEnviar">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>

            <p class="loja-chat-rodape" id="chatRodape"></p>

        </main>

        <!-- COLUNA DIREITA -->
        <aside class="col-lg-3 d-none d-lg-block right-col">
            <div class="right-card">
                <h5>Sobre este atendimento</h5>
                <small class="text-secondary">
                    Quem responde aqui é o agente da loja, não uma pessoa. Ele só
                    fala do que o lojista cadastrou: produtos, preços, horários.
                    <br><br>
                    Quando não souber, ele passa o WhatsApp para você falar com
                    alguém de verdade.
                </small>
            </div>

            <div class="right-card">
                <h5>Carrinho</h5>
                <div id="chatCarrinho">
                    <p class="text-secondary mb-0 small">Nada no carrinho ainda.</p>
                </div>
            </div>

        </aside>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/echo-ui.js?v=20260929b"></script>
<script src="js/echo-bit.js?v=20260920a"></script>
<script src="js/loja-chat.js?v=20260920a"></script>
</body>
</html>
